name: Build SALEK HYPERCORE VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Locate VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem -Path build -Recurse -Filter *.vst3 | ForEach-Object {
            Copy-Item $_.FullName -Destination dist -Recurse -Force
          }
          Get-ChildItem -Path dist -Recurse

      - name: Upload SALEK HYPERCORE VST3
        uses: actions/upload-artifact@v4
        with:
          name: SALEK-HYPERCORE-Windows-VST3
          path: dist
          if-no-files-found: error
